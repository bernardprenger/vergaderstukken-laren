name: Vergaderstukken Laren
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: vergaderstukken-laren
  cancel-in-progress: false
jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stukken ophalen
        run: python3 scripts/monitor.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overzicht.md state.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git commit -m "Vergaderstukken bijgewerkt $(date -u +%F)"
          git push
